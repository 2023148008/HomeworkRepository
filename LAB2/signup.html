<!DOCTYPE html>
<html lang="ko">

    <head>
        <meta charset="UTF-8">
        <title>로그인</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        <h1><strong>Welcome to <span class="highlight">INTERNET-PROGRAMMING MOVIE SITE</span></strong></h1>
            <div class="links">
                <a href="login.html" class="join-link">로그인</a> | <a>회원가입</a>
            </div>

        <div class="box">
            <form action="#" method="post">

                <div class="row">
                    <label for="name">이름 :</label>
                    <input type="text" id="name" name="name" required autofocus>
                </div>

                <div class="row">
                    <label for="birth"> 생일 :</label>
                    <input type="date" id="birth" name="birth" required>
                </div>

                <div class="row">
                    <label> 성별 :</label>
                    <label for="male">남성</label>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="female">여성</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                </div>

                <div class="row">
                    <label for="grade"> 학년 :</label>
                    <input type="number" id="grade" name="grade" min="1" max="4" step="1" required>
                </div>

                <div class="row">
                    <label for="username">아이디 :</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="row">
                    <label for="password">비밀번호 :</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="row">
                    <label for="email">이메일 :</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="row">
                    <label for="question">보안 질문 :</label>
                    <select id="question" name="question" required>
                        <option value="">질문을 선택하세요</option>
                        <option value="">당신이 제일 좋아하는 음식은?</option>
                        <option value="">당신의 첫 반려동물 이름은?</option>
                        <option value="">당신이 태어난 도시는?</option>
                        <option value="">당신이 졸업한 고등학교는?</option>
                    </select>
                </div>

                <div class="row">
                    <label for="answer">답변 :</label>
                    <input type="text" id="answer" name="answer" required>
                </div>

                

                <div class="button-group">
                    <button type="submit" class="login-btn">Signup</button>
                    <button type="reset"  class="cancel-btn">Cancel</button>
                </div>
                


            </form>

        </div>
    </body>

</html>
