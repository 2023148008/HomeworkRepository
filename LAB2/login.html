<!DOCTYPE html>
<html lang="ko">

    <head>
        <meta charset="UTF-8">
        <title>로그인</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        <h1><strong>Welcome to <span class="highlight">INTERNET-PROGRAMMING MOVIE SITE</span></strong></h1>

        <div class="links">
            <a>로그인</a> | <a href="signup.html" class="join-link">회원가입</a>
        </div>

        <div class="box">
            <form action="#" method="post">
                <div class="row">
                    <label for="username">아이디 :</label>
                    <input type="text" id="username" name="username" placeholder="아이디 입력" autofocus autocomplete="on">
                </div>

                <div class="row">
                    <label for="password">비밀번호 :</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력" >
                </div>


                

                <div class="button-group">
                    <button type="submit" class="login-btn">Login</button>
                    <button type="button" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </body>
</html>
